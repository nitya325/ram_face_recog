<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0b0d;
        --panel: #121417;
        --border: #23262b;
        --border-soft: #1a1c20;
        --text: #e8eaed;
        --text-dim: #7c838c;
        --accent: #5fcbba;      /* known match */
        --unknown: #6b7078;     /* unknown face */
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px 80px;
    }

    header {
        width: 100%;
        max-width: 640px;
        margin-bottom: 24px;
    }

    header .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        text-transform: uppercase;
    }

    h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 6px 0 0;
        letter-spacing: -0.01em;
    }

    #app {
        width: 100%;
        max-width: 640px;
    }

    #video-container {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #000;
        border: 1px solid var(--border);
        overflow: hidden;
    }

    #video-feed {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    #video-container::before {
        /* idle-state placeholder text, hidden once video has data */
        content: "NO SIGNAL";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: var(--text-dim);
        pointer-events: none;
    }

    #video-container.live::before { content: none; }

    .rec-dot {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--text);
        background: rgba(0,0,0,0.5);
        padding: 4px 8px;
        z-index: 5;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .rec-dot.on { opacity: 1; }
    .rec-dot .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e0714b;
        animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
    }

    /* Corner-bracket reticle instead of a full glowing box */
    .reticle { position: absolute; pointer-events: none; }
    .reticle .corner {
        position: absolute;
        width: 14px;
        height: 14px;
    }
    .reticle.known .corner { border-color: var(--accent); }
    .reticle.unknown .corner { border-color: var(--unknown); }
    .corner.tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; }
    .corner.tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; }
    .corner.bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; }
    .corner.br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; }

    .reticle-label {
        position: absolute;
        top: -22px;
        left: 0;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.03em;
        white-space: nowrap;
        padding: 2px 0;
    }
    .reticle.known .reticle-label { color: var(--accent); }
    .reticle.unknown .reticle-label { color: var(--unknown); }

    .controls {
        display: flex;
        gap: 10px;
        margin-top: 16px;
    }

    button {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 11px 20px;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
    }
    button:hover { border-color: var(--text-dim); }
    #start-btn:hover { border-color: var(--accent); color: var(--accent); }
    #stop-btn:hover { border-color: var(--unknown); }

    /* Status readout panel */
    #status-panel {
        margin-top: 16px;
        border: 1px solid var(--border);
        background: var(--panel);
    }

    .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border-soft);
        font-family: 'IBM Plex Mono', monospace;
    }
    .status-row:last-child { border-bottom: none; }

    .status-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        text-transform: uppercase;
    }

    .status-value {
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
    }
    .status-value.accent { color: var(--accent); }
    .status-value.dim { color: var(--text-dim); font-weight: 400; }

    #status-note {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        color: #d65f5f;
        margin-top: 10px;
        min-height: 14px;
    }
</style>
</head>
<body>

<header>
    <div class="eyebrow">Local inference &middot; LBPH</div>
    <h1>Real-Time Face Recognition</h1>
</header>

<div id="app">
    <div id="video-container">
        <video id="video-feed" autoplay playsinline muted></video>
        <div class="rec-dot" id="rec-dot"><span class="dot"></span>LIVE</div>
    </div>

    <div class="controls">
        <button id="start-btn">Start Recognition</button>
        <button id="stop-btn" style="display:none;">Stop Recognition</button>
    </div>

    <div id="status-panel">
        <div class="status-row">
            <span class="status-label">Status</span>
            <span class="status-value dim" id="status-state">Idle</span>
        </div>
        <div class="status-row">
            <span class="status-label">Identity</span>
            <span class="status-value" id="status-identity">&mdash;</span>
        </div>
        <div class="status-row">
            <span class="status-label">Confidence</span>
            <span class="status-value dim" id="status-confidence">&mdash;</span>
        </div>
    </div>

    <div id="status-note"></div>
</div>

<script>
    const video = document.getElementById('video-feed');
    const videoContainer = document.getElementById('video-container');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const recDot = document.getElementById('rec-dot');
    const statusState = document.getElementById('status-state');
    const statusIdentity = document.getElementById('status-identity');
    const statusConfidence = document.getElementById('status-confidence');
    const statusNote = document.getElementById('status-note');

    let recognitionIntervalId;
    let stream;
    let consecutiveErrors = 0;
    const MAX_CONSECUTIVE_ERRORS = 5;

    function startRecognition() {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(s => {
                stream = s;
                video.srcObject = stream;
                video.addEventListener('loadeddata', () => {
                    video.play();
                    videoContainer.classList.add('live');
                    recDot.classList.add('on');
                    statusState.textContent = 'Scanning';
                    statusState.classList.remove('dim');
                    startProcessing();
                }, { once: true });
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                statusNote.textContent = '';
            })
            .catch(err => {
                console.error("Error accessing the webcam: ", err);
                statusNote.textContent = 'Could not access webcam. Check browser permissions.';
            });
    }

    function stopRecognition() {
        clearInterval(recognitionIntervalId);
        if (stream) stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        videoContainer.classList.remove('live');
        recDot.classList.remove('on');
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
        statusState.textContent = 'Idle';
        statusState.classList.add('dim');
        statusIdentity.textContent = '\u2014';
        statusConfidence.textContent = '\u2014';
        statusIdentity.classList.remove('accent');
        document.querySelectorAll('.reticle').forEach(el => el.remove());
    }

    function startProcessing() {
        const recognitionInterval = 200;
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        consecutiveErrors = 0;

        recognitionIntervalId = setInterval(() => {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            fetch('/recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_data: imageData })
            })
            .then(response => {
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                return response.json();
            })
            .then(data => {
                consecutiveErrors = 0;
                updateUI(data, canvas.width, canvas.height);
            })
            .catch(error => {
                console.error('Error during recognition:', error);
                consecutiveErrors++;
                if (consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
                    statusNote.textContent = 'Losing connection to the server. Check your network or reload.';
                }
            });
        }, recognitionInterval);
    }

    function updateUI(data, canvasWidth, canvasHeight) {
        document.querySelectorAll('.reticle').forEach(el => el.remove());

        // Face coordinates are in native camera resolution; the <video>
        // element is displayed at a CSS-driven size (object-fit: cover),
        // so scale + offset accordingly before placing overlays.
        const displayedWidth = video.clientWidth;
        const displayedHeight = video.clientHeight;
        const videoRatio = canvasWidth / canvasHeight;
        const displayRatio = displayedWidth / displayedHeight;

        let scale, offsetX = 0, offsetY = 0;
        if (displayRatio > videoRatio) {
            scale = displayedWidth / canvasWidth;
            offsetY = (displayedHeight - canvasHeight * scale) / 2;
        } else {
            scale = displayedHeight / canvasHeight;
            offsetX = (displayedWidth - canvasWidth * scale) / 2;
        }

        if (data.faces && data.faces.length > 0) {
            const main = data.faces[0];
            statusIdentity.textContent = main.name;
            statusIdentity.classList.toggle('accent', main.name !== 'Unknown');
            statusConfidence.textContent = main.name === 'Unknown' ? '\u2014' : main.confidence.toFixed(2);

            data.faces.forEach(face => {
                const { name, confidence, face_location } = face;
                const { x, y, w, h } = face_location;
                const known = name !== 'Unknown';

                const reticle = document.createElement('div');
                reticle.className = 'reticle ' + (known ? 'known' : 'unknown');
                reticle.style.left = `${x * scale + offsetX}px`;
                reticle.style.top = `${y * scale + offsetY}px`;
                reticle.style.width = `${w * scale}px`;
                reticle.style.height = `${h * scale}px`;

                ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                    const c = document.createElement('span');
                    c.className = `corner ${pos}`;
                    reticle.appendChild(c);
                });

                const label = document.createElement('div');
                label.className = 'reticle-label';
                label.textContent = known ? `${name} ${confidence.toFixed(1)}` : 'UNKNOWN';
                reticle.appendChild(label);

                videoContainer.appendChild(reticle);
            });
        } else {
            statusIdentity.textContent = '\u2014';
            statusIdentity.classList.remove('accent');
            statusConfidence.textContent = '\u2014';
        }
    }

    startBtn.addEventListener('click', startRecognition);
    stopBtn.addEventListener('click', stopRecognition);
</script>
</body>
</html>
